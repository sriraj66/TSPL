version: '3.8'

networks:
  internal_network:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - internal_network
    volumes:
      - media_volume:/app/media
      - static_volume:/app/static
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - celery

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal_network
    volumes:
      - static_volume:/static
      - media_volume:/app/media
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    restart: always
    networks:
      - internal_network
    volumes:
      - pg_volume:/var/lib/postgresql/data 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  db-adminer:
    image: adminer
    restart: always
    ports:
      - "5433:8080"

  redis:
    image: redis:alpine
    networks:
      - internal_network
    volumes:
      - redis_volume:/data
    ports:
      - "6379"

  celery:
    image: celery:latest
    networks:
      - internal_network
    command: celery -A backend worker --loglevel=info
    depends_on:
      - redis
      - db
    env_file:
      - .env
    volumes:
      - media_volume:/app/media
      - static_volume:/app/static
    restart: always

volumes:
  static_volume:
  media_volume:
  pg_volume:
  redis_volume:
